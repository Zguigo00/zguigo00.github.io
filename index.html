<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>zguigo | 全栈开发</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Noto+Sans+SC:wght@300;400;700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg-deep: #06060f;
  --cyan: #00f0ff;
  --cyan-dim: rgba(0,240,255,0.3);
  --purple: #b347ea;
  --purple-dim: rgba(179,71,234,0.3);
  --text: #d0d0d8;
  --text-dim: #7878a0;
  --glass-bg: rgba(12,12,30,0.7);
  --glass-border: rgba(0,240,255,0.08);
  --radius: 14px;
}

* { margin:0; padding:0; box-sizing:border-box; }

body {
  background: var(--bg-deep);
  color: var(--text);
  font-family: 'Noto Sans SC', 'Microsoft YaHei', sans-serif;
  overflow-x: hidden;
  -webkit-font-smoothing: antialiased;
}

/* ── Scanline overlay ── */
body::after {
  content: '';
  position: fixed; inset: 0; z-index: 9999; pointer-events: none;
  background: repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(0,0,0,0.03) 2px, rgba(0,0,0,0.03) 4px);
}

/* ── Grid background ── */
.grid-bg {
  position: fixed; inset: 0; z-index: 0; pointer-events: none;
  background-image:
    linear-gradient(rgba(0,240,255,0.03) 1px, transparent 1px),
    linear-gradient(90deg, rgba(0,240,255,0.03) 1px, transparent 1px);
  background-size: 60px 60px;
  mask-image: radial-gradient(ellipse 70% 70% at 50% 30%, black 30%, transparent 70%);
  -webkit-mask-image: radial-gradient(ellipse 70% 70% at 50% 30%, black 30%, transparent 70%);
}

canvas#particles { position:fixed; inset:0; z-index:1; pointer-events:none; }

/* ── Main layout ── */
main { position:relative; z-index:2; }

section {
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  padding: 60px 24px;
}

.section-title {
  font-family: 'Orbitron', sans-serif;
  font-size: clamp(1.4rem, 3vw, 1.8rem);
  font-weight: 700;
  letter-spacing: 0.2em;
  text-transform: uppercase;
  color: var(--cyan);
  text-shadow: 0 0 10px var(--cyan-dim), 0 0 40px rgba(0,240,255,0.15);
  margin-bottom: 48px;
  position: relative;
}
.section-title::after {
  content: '';
  position: absolute;
  bottom: -12px; left: 50%; transform: translateX(-50%);
  width: 60px; height: 2px;
  background: linear-gradient(90deg, transparent, var(--cyan), transparent);
}

/* ── Glass card ── */
.glass {
  background: var(--glass-bg);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  border: 1px solid var(--glass-border);
  border-radius: var(--radius);
}

/* ── HERO ── */
.hero { text-align:center; position:relative; }
.hero-icon {
  font-size: 4rem;
  margin-bottom: 16px;
  animation: float 3s ease-in-out infinite;
  filter: drop-shadow(0 0 20px rgba(0,240,255,0.4));
}
@keyframes float {
  0%,100% { transform: translateY(0); }
  50% { transform: translateY(-12px); }
}

.hero h1 {
  font-family: 'Orbitron', sans-serif;
  font-size: clamp(1.6rem, 5vw, 2.8rem);
  font-weight: 900;
  letter-spacing: 0.08em;
  color: #fff;
  text-shadow:
    0 0 7px var(--cyan),
    0 0 20px var(--cyan),
    0 0 40px var(--cyan),
    0 0 80px var(--cyan),
    0 0 120px rgba(0,240,255,0.4);
  animation: glowPulse 3s ease-in-out infinite;
}
@keyframes glowPulse {
  0%,100% { text-shadow: 0 0 7px var(--cyan), 0 0 20px var(--cyan), 0 0 40px var(--cyan), 0 0 80px var(--cyan), 0 0 120px rgba(0,240,255,0.4); }
  50% { text-shadow: 0 0 10px var(--cyan), 0 0 30px var(--cyan), 0 0 60px var(--cyan), 0 0 100px var(--cyan), 0 0 150px rgba(0,240,255,0.5); }
}

.hero-subtitle {
  font-family: 'Orbitron', 'Noto Sans SC', sans-serif;
  font-size: clamp(1rem, 3vw, 1.5rem);
  font-weight: 700;
  letter-spacing: 0.3em;
  margin-top: 16px;
  color: #fff;
  text-shadow:
    0 0 5px var(--purple),
    0 0 15px var(--purple),
    0 0 30px var(--purple),
    0 0 60px rgba(179,71,234,0.5);
  animation: glowPulsePurple 3s ease-in-out infinite 0.5s;
}
@keyframes glowPulsePurple {
  0%,100% { text-shadow: 0 0 5px var(--purple), 0 0 15px var(--purple), 0 0 30px var(--purple), 0 0 60px rgba(179,71,234,0.5); }
  50% { text-shadow: 0 0 8px var(--purple), 0 0 25px var(--purple), 0 0 50px var(--purple), 0 0 80px rgba(179,71,234,0.6); }
}

.hero-tagline {
  margin-top: 24px;
  font-family: 'JetBrains Mono', monospace;
  font-size: 0.9rem;
  color: var(--text-dim);
  letter-spacing: 0.15em;
}
.hero-tagline span { color: var(--cyan); }

.hero-btn {
  display: inline-flex; align-items: center; gap: 10px;
  margin-top: 36px;
  padding: 14px 36px;
  font-family: 'JetBrains Mono', monospace;
  font-size: 0.85rem;
  color: var(--cyan);
  text-decoration: none;
  background: rgba(0,240,255,0.05);
  border: 1px solid rgba(0,240,255,0.3);
  border-radius: 4px;
  letter-spacing: 0.1em;
  transition: all 0.3s ease;
  position: relative;
  overflow: hidden;
}
.hero-btn::before {
  content: '';
  position: absolute; inset: 0;
  background: linear-gradient(135deg, rgba(0,240,255,0.1), transparent);
  opacity: 0; transition: opacity 0.3s;
}
.hero-btn:hover {
  border-color: var(--cyan);
  box-shadow: 0 0 20px var(--cyan-dim), 0 0 40px rgba(0,240,255,0.1), inset 0 0 20px rgba(0,240,255,0.05);
  transform: translateY(-2px);
}
.hero-btn:hover::before { opacity: 1; }
.hero-btn:active { transform: translateY(0); }

.scroll-indicator {
  position: absolute;
  bottom: 40px; left: 50%; transform: translateX(-50%);
  color: var(--text-dim);
  font-size: 1.5rem;
  animation: bounce 2s ease-in-out infinite;
  cursor: default;
}
@keyframes bounce {
  0%,20%,50%,80%,100% { transform: translateX(-50%) translateY(0); }
  40% { transform: translateX(-50%) translateY(-10px); }
  60% { transform: translateX(-50%) translateY(-5px); }
}

/* ── ABOUT ── */
.about { min-height:auto; padding:80px 24px; }
.about-grid {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 16px;
  max-width: 900px; width: 100%;
}
.about-card {
  padding: 32px 20px;
  text-align: center;
  transition: all 0.3s ease;
  position: relative;
  overflow: hidden;
}
.about-card::after {
  content: '';
  position: absolute; bottom: 0; left: 0; right: 0;
  height: 2px;
  background: linear-gradient(90deg, transparent, var(--cyan), transparent);
  opacity: 0.5;
}
.about-card:hover {
  transform: translateY(-4px);
  border-color: rgba(0,240,255,0.3);
  box-shadow: 0 8px 30px rgba(0,0,0,0.4), 0 0 30px rgba(0,240,255,0.06);
}
.about-card .label {
  font-family: 'JetBrains Mono', monospace;
  font-size: 0.7rem;
  color: var(--text-dim);
  text-transform: uppercase;
  letter-spacing: 0.15em;
  margin-bottom: 12px;
}
.about-card .value {
  font-size: 1.1rem;
  font-weight: 700;
  color: #fff;
}
.about-card .icon { font-size: 2rem; margin-bottom: 8px; }

/* ── SKILLS ── */
.skills { min-height:auto; padding:80px 24px; }
.skills-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
  gap: 16px;
  max-width: 700px; width: 100%;
}
.skill-card {
  padding: 20px 16px;
  text-align: center;
  transition: all 0.3s ease;
  position: relative;
  overflow: hidden;
}
.skill-card:hover {
  transform: translateY(-3px);
  border-color: rgba(179,71,234,0.3);
  box-shadow: 0 6px 20px rgba(0,0,0,0.3), 0 0 20px var(--purple-dim);
}
.skill-card .icon { font-size: 1.6rem; margin-bottom: 8px; }
.skill-card .name {
  font-family: 'JetBrains Mono', monospace;
  font-size: 0.75rem;
  color: var(--text);
  margin-bottom: 10px;
  letter-spacing: 0.05em;
}
.skill-bar {
  height: 3px;
  background: rgba(255,255,255,0.06);
  border-radius: 2px;
  overflow: hidden;
}
.skill-bar-fill {
  height: 100%;
  border-radius: 2px;
  background: linear-gradient(90deg, var(--cyan), var(--purple));
  background-size: 200% 100%;
  animation: shimmer 2.5s ease-in-out infinite;
  transition: width 1s ease;
}
@keyframes shimmer {
  0%,100% { background-position: 0% 50%; }
  50% { background-position: 100% 50%; }
}

/* ── CONTACT ── */
.contact { min-height:auto; padding:80px 24px; }
.contact-row {
  display: flex; gap: 20px; flex-wrap: wrap; justify-content: center;
  max-width: 500px; width: 100%;
}
.contact-card {
  display: flex; align-items: center; gap: 12px;
  padding: 16px 24px;
  text-decoration: none;
  color: var(--text);
  font-family: 'JetBrains Mono', monospace;
  font-size: 0.8rem;
  letter-spacing: 0.05em;
  transition: all 0.3s ease;
  flex: 1; min-width: 140px; justify-content: center;
}
.contact-card:hover {
  border-color: rgba(0,240,255,0.3);
  box-shadow: 0 0 20px var(--cyan-dim);
  color: var(--cyan);
  transform: translateY(-2px);
}
.contact-card .icon { font-size: 1.3rem; }

/* ── FOOTER ── */
footer {
  text-align: center;
  padding: 40px 24px;
  font-family: 'JetBrains Mono', monospace;
  font-size: 0.7rem;
  color: var(--text-dim);
  letter-spacing: 0.1em;
  position: relative; z-index: 2;
}

/* ── Scroll reveal ── */
[data-reveal] {
  opacity: 0;
  transform: translateY(30px);
  transition: opacity 0.7s ease, transform 0.7s ease;
}
[data-reveal].revealed {
  opacity: 1;
  transform: translateY(0);
}

/* ── Reduced motion ── */
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: 0.01ms !important;
    transition-duration: 0.01ms !important;
  }
  [data-reveal] { opacity:1; transform:none; }
  canvas#particles { display:none; }
}

/* ── Responsive ── */
@media (max-width: 640px) {
  .about-grid { grid-template-columns: 1fr; }
  .skills-grid { grid-template-columns: repeat(2, 1fr); }
  .hero-icon { font-size: 3rem; }
}
@media (min-width: 641px) and (max-width: 1024px) {
  .about-grid { grid-template-columns: repeat(2, 1fr); gap:12px; }
  .about-card { padding: 24px 12px; }
}
</style>
</head>
<body>

<div class="grid-bg"></div>
<canvas id="particles"></canvas>

<main>
  <section class="hero">
    <div class="hero-icon">🚀</div>
    <h1>欢迎来到zguigo的网站</h1>
    <p class="hero-subtitle">实现共产</p>

      </div>
      <div class="about-card glass">
        <div class="icon">📬</div>
        <div class="label">联系方式</div>

  <section class="contact" data-reveal>

    <div class="contact-row">
      <a href="https://github.com/Zguigo00" class="contact-card glass" target="_blank" rel="noopener noreferrer">

      </a>
    </div>
  </section>

  <footer>
    <p>&copy; 2026 zguigo — Built with passion</p>

</main>

<script>
(function() {
  // ── Particles ──
  const canvas = document.getElementById('particles');
  const ctx = canvas.getContext('2d');
  const isMobile = window.innerWidth < 768;
  const count = isMobile ? 40 : 70;
  let particles = [];
  let animId;
  let mouse = { x: -999, y: -999 };

  function resize() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
  }
  window.addEventListener('resize', resize);
  resize();

  class Particle {
    constructor() {
      this.reset();
      this.y = Math.random() * canvas.height;
    }
    reset() {
      this.x = Math.random() * canvas.width;
      this.y = Math.random() * canvas.height;
      this.vx = (Math.random() - 0.5) * 0.4;
      this.vy = (Math.random() - 0.5) * 0.4;
      this.r = Math.random() * 1.5 + 0.5;
      this.o = Math.random() * 0.4 + 0.15;
    }
    update() {
      this.x += this.vx;
      this.y += this.vy;
      if (this.x < -20) this.x = canvas.width + 20;
      if (this.x > canvas.width + 20) this.x = -20;
      if (this.y < -20) this.y = canvas.height + 20;
      if (this.y > canvas.height + 20) this.y = -20;

      const dx = mouse.x - this.x;
      const dy = mouse.y - this.y;
      const dist = Math.sqrt(dx*dx+dy*dy);
      if (dist < 120) {
        this.x -= dx * 0.002;
        this.y -= dy * 0.002;
      }
    }
    draw() {
      ctx.beginPath();
      ctx.arc(this.x, this.y, this.r, 0, Math.PI*2);
      ctx.fillStyle = `rgba(0,240,255,${this.o})`;
      ctx.fill();
    }
  }

  for (let i = 0; i < count; i++) particles.push(new Particle());

  function animate() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    for (let i = 0; i < particles.length; i++) {
      particles[i].update();
      particles[i].draw();

      for (let j = i + 1; j < particles.length; j++) {
        const dx = particles[i].x - particles[j].x;
        const dy = particles[i].y - particles[j].y;
        const dist = Math.sqrt(dx*dx+dy*dy);
        if (dist < 130) {
          ctx.beginPath();
          ctx.moveTo(particles[i].x, particles[i].y);
          ctx.lineTo(particles[j].x, particles[j].y);
          ctx.strokeStyle = `rgba(0,240,255,${0.08 * (1 - dist/130)})`;
          ctx.lineWidth = 0.5;
          ctx.stroke();
        }
      }
    }
    animId = requestAnimationFrame(animate);
  }

  document.addEventListener('mousemove', e => { mouse.x = e.clientX; mouse.y = e.clientY; });
  document.addEventListener('mouseleave', () => { mouse.x = -999; mouse.y = -999; });

  // Pause when tab hidden
  document.addEventListener('visibilitychange', () => {
    if (document.hidden) {
      cancelAnimationFrame(animId);
      animId = null;
    } else if (!animId) {
      animId = requestAnimationFrame(animate);
    }
  });

  const mq = window.matchMedia('(prefers-reduced-motion: reduce)');
  if (!mq.matches) animId = requestAnimationFrame(animate);
  mq.addEventListener('change', e => {
    if (e.matches) { cancelAnimationFrame(animId); animId = null; }
    else if (!animId) animId = requestAnimationFrame(animate);
  });

  // ── Scroll reveal ──
  const observer = new IntersectionObserver(entries => {
    entries.forEach(entry => {
      if (entry.isIntersecting) {
        requestAnimationFrame(() => entry.target.classList.add('revealed'));
        observer.unobserve(entry.target);
      }
    });
  }, { threshold: 0.15 });

  document.querySelectorAll('[data-reveal]').forEach(el => observer.observe(el));

  // ── Skill bar animation on reveal ──
  const skillObserver = new IntersectionObserver(entries => {
    entries.forEach(entry => {
      if (entry.isIntersecting) {
        const fills = entry.target.querySelectorAll('.skill-bar-fill');
        fills.forEach(f => {
          const w = f.style.width;
          f.style.width = '0%';
          requestAnimationFrame(() => { f.style.width = w; });
        });
        skillObserver.unobserve(entry.target);
      }
    });
  }, { threshold: 0.2 });

  const skillsSection = document.querySelector('.skills');
  if (skillsSection) skillObserver.observe(skillsSection);
})();
</script>
</body>
